info:
  name: User Login
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:7119/api/Auth
  body:
    type: json
    data: |-
      {
        "login": "user",
        "password": "user"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
